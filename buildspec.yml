version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 18
  build:
    commands:
      - echo "Build started on `date`"
      - echo "Preparing static files for deployment..."
  post_build:
    commands:
      - echo "Build completed on `date`"
      # Artifacts akan dikemas oleh CodeBuild dan dapat di-deploy
      # ke layanan AWS lainnya (misalnya via CodePipeline atau Amplify).

artifacts:
  files:
    - index.html
    - js/**/*
    - css/**/*
    - assets/**/*
